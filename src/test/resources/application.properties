# Phase 17: test-scope application.properties.
#
# Maven puts target/test-classes ahead of target/classes on the test
# classpath, and AppConfig loads exactly ONE /application.properties (the
# first one the classloader finds) - it does not merge this file with
# src/main/resources/application.properties. This file therefore has to be a
# full superset of the main file's keys, not just the overrides: the
# pre-existing AppConfigTest, for one, reads app.name and
# db.pool.maximumPoolSize straight from "the real application.properties on
# the test classpath" (see its own class Javadoc) and would fail if this
# file only carried the DB settings.
#
# Only the values marked TEST-OVERRIDE below differ from the main file.
app.name=IntelliResult Nexus
app.environment=development
app.session.timeoutMinutes=30
security.bcrypt.cost=10
security.public.paths=/,/login,/register,/forgot-password,/assets,/common,/verify

# TEST-OVERRIDE: an in-memory H2 database instead of MySQL.
# MODE=MySQL narrows the gap between H2's and MySQL's SQL dialects;
# DB_CLOSE_DELAY=-1 keeps the in-memory database alive for the whole JVM
# instead of dropping it the moment the first Session/Connection closes,
# since HibernateUtil's SessionFactory (and its connection pool) is a
# single static field built once per test run.
db.url=jdbc:h2:mem:intelliresult_test;MODE=MySQL;DB_CLOSE_DELAY=-1
db.username=sa
db.password=sa
# TEST-OVERRIDE: create (not update/validate). Hibernate derives the schema
# straight from the entity annotations once, at SessionFactory build time.
# This is what actually exercises every @Entity/@Table/@Column/@JoinColumn
# mapping - the exact class of bug (an entity present in Java but missing or
# wrong in the mapped model) that reached production in this project before,
# per the bundled logs from 2026-09-24.
db.schema.management=create
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=30000
db.pool.idleTimeoutMs=600000

sentry.environment=development
sentry.tracesSampleRate=0.2
import.excel.maxFileSizeBytes=5242880

# TEST-OVERRIDE: several code paths under test (registration approval,
# re-evaluation resolution, bulk student import) send notification emails.
# EmailNotificationService already treats a failed send as a logged warning,
# never an error, so the only thing that matters here is that the attempt
# fails instantly and deterministically instead of depending on DNS for the
# placeholder domain or on whatever the test machine's network does.
# Port 9 (the "discard" service) on the loopback address is closed on any
# normal machine, so the connection is refused immediately.
mail.host=127.0.0.1
mail.port=9
mail.username=noreply@example.edu
